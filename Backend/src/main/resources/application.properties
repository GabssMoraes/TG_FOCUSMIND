spring.application.name=FocusMindAPI

# Configurações de Porta (Padrão 8080 mas garantindo que não colida com React)
server.port=8080

# Configuração do PostgreSQL
# As credenciais reais do banco estão no arquivo application-secret.properties (que foi adicionado ao .gitignore)!
spring.datasource.url=jdbc:postgresql://172.18.16.1:5432/TGFOCUSMIND
spring.datasource.driver-class-name=org.postgresql.Driver

# Importa as configurações do arquivo application-secret.properties
spring.profiles.include=secret

# Configurações do Hibernate (Criação de tabelas automático)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configurações da API do Gemini
gemini.api.key=${GEMINI_API_KEY}
gemini.api.chat-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
gemini.api.embedding-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent

# ── Configurações de E-mail (Brevo SMTP) ──
# As credenciais reais estão no application-secret.properties
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
app.mail.from=${MAIL_FROM}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
